name: Photos des lutins

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0 pillow-heif==0.18.0
      - run: python .github/scripts/sync_photos_lutins.py
      - run: |
          git add lutins/photos
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchronise les photos des lutins depuis Drive"
          git push
